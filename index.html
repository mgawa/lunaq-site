<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNAQ</title>
<style>
body {
 margin:0;
 background:#07080b;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
}
.wrap {
 max-width:1400px;
 margin:auto;
 padding:20px;
}
nav {
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:18px 0;
}
.brand {
 display:flex;
 align-items:center;
 gap:14px;
}
.brand img {
 height:58px;
 width:auto;
 object-fit:contain;
}
.brand span {
 font-size:32px;
 font-weight:800;
 letter-spacing:4px;
}
.hero {
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:40px;
 align-items:center;
 min-height:80vh;
}
.hero h1 {
 font-size:82px;
 line-height:0.95;
 margin:0 0 20px;
}
.gold {
 color:#e5c27a;
}
.hero p {
 font-size:28px;
 color:#cbb98a;
 line-height:1.5;
}
.biglogo {
 text-align:center;
}
.biglogo img {
 width:100%;
 max-width:720px;
 height:auto;
 object-fit:contain;
 filter:drop-shadow(0 15px 35px rgba(0,0,0,.35));
}
.btn {
 display:inline-block;
 padding:18px 34px;
 background:#e5c27a;
 color:#111;
 border-radius:14px;
 font-weight:700;
 margin-top:20px;
 text-decoration:none;
}
@media(max-width:900px){
.hero{grid-template-columns:1fr}
.hero h1{font-size:52px}
.hero p{font-size:22px}
}
</style>
</head>
