<style>
body{margin:0;background:radial-gradient(circle at top right,#1a1622,#08090d 55%,#050505);color:#fff;font-family:Arial,sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;position:sticky;top:0;background:rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:14px} .brand img{height:56px} .brand b{font-size:34px;letter-spacing:4px}
.menu a{color:#d9c18a;text-decoration:none;margin:0 14px;font-weight:700}
.btn{background:#d9c18a;color:#111;padding:14px 24px;border-radius:14px;text-decoration:none;font-weight:800}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;max-width:1400px;margin:auto;padding:70px 40px;align-items:center}
h1{font-size:86px;line-height:.95;margin:0} .gold{color:#d9c18a}
p{font-size:26px;color:#d7d0bf;line-height:1.5}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(217,193,138,.15);border-radius:24px;padding:30px}
.logoHero img{width:100%;max-width:620px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1400px;margin:0 auto 60px;padding:0 40px}
.stat{padding:24px;border-radius:20px;background:rgba(255,255,255,.03)}
.small{color:#c9b98a;font-size:14px;text-transform:uppercase;letter-spacing:2px}
.val{font-size:34px;font-weight:800;margin-top:10px}
@media(max-width:900px){.hero{grid-template-columns:1fr}h1{font-size:56px}p{font-size:20px}.stats{grid-template-columns:1fr}nav{padding:16px}.menu{display:none}}
</style></head>
